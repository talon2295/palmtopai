name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Tests, types, lint and builds
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  # 1.3.7–1.3.8 hang at random while loading modules (oven-sh/bun#26810).
                  bun-version: 1.4.2
            - uses: actions/setup-node@v5
              with:
                  # The CLI and the daemon are shipped for Node.js 22+, and some tests run them on it.
                  node-version: 22
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run test
            - run: bun run build:web
            - run: bun run build:cli

    windows:
        # Only by hand (Actions → CI → Run workflow, or `gh workflow run ci.yml --ref <branch>`):
        # Windows support is being built, so some steps are red until it is done. Every step runs
        # even if an earlier one fails, to read all the causes in one run.
        name: Windows (by hand)
        if: github.event_name == 'workflow_dispatch'
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
              if: ${{ !cancelled() }}
            - run: bun run lint
              if: ${{ !cancelled() }}
            # The three parts of `bun run test`, apart: a red one does not hide the others.
            - run: bun test ./packages ./integrations ./apps/relay
              if: ${{ !cancelled() }}
            - run: bun test
              working-directory: apps/web
              if: ${{ !cancelled() }}
            - run: bun test
              working-directory: apps/site
              if: ${{ !cancelled() }}
            - run: bun run build:web
              if: ${{ !cancelled() }}
            - run: bun run build:cli
              if: ${{ !cancelled() }}
            # What a person does on Windows: install.ps1 from PowerShell 5.1 and 7, the PATH, the
            # daemon (start, stop), the permissions of the home. Changes the PATH of this runner.
            - run: bun packages/cli/scripts/windows-smoke.ts
              if: ${{ !cancelled() }}

    secrets:
        name: Secret scan
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        env:
            # The version used locally; the release binary needs no Node.js and no token.
            GITLEAKS_VERSION: 8.30.1
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Install gitleaks
              run: |
                  curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                      | tar -xz -C "$RUNNER_TEMP" gitleaks
            - name: Scan the whole history
              run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all'
