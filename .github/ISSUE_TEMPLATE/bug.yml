name: Bug report
description: Something in palmtop doesn't work as it should.
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for the report. For a security issue, don't open an issue: see [SECURITY.md](https://github.com/talon2295/palmtopai/blob/main/SECURITY.md).
    - type: textarea
      id: what
      attributes:
          label: What happened
          description: What you did, what you expected and what happened instead.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. palmtop session start "..."
              2. ...
    - type: input
      id: os
      attributes:
          label: Operating system
          placeholder: macOS 15, Ubuntu 24.04, Windows 11, WSL, ...
      validations:
          required: true
    - type: input
      id: node
      attributes:
          label: Node.js version
          description: The output of `node --version`.
      validations:
          required: true
    - type: input
      id: agent
      attributes:
          label: Agent
          placeholder: Claude Code 2.x, Codex, other
    - type: input
      id: device
      attributes:
          label: Device and browser
          placeholder: iPhone, Safari 18, added to the Home Screen
    - type: textarea
      id: status
      attributes:
          label: Output of `palmtop status`
          description: Run it in your project. It never shows keys or pairing links.
          render: text
